
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c1b">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Stillwater Rig Assistant</title>

  <style>
    :root {
      --bg: #101c1b;
      --panel: #1a2b28;
      --panel-soft: #223631;
      --border: #344a42;
      --text: #f0f3ec;
      --muted: #a8bdb3;
      --gold: #e2c17d;
      --mint: #b8ddc7;
      --result: #e0ebdf;
      --ink: #18332b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 520px;
      margin: auto;
      padding: 18px 16px 38px;
    }

    .hero {
      position: relative;
      padding: 28px 22px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        radial-gradient(
          circle at top right,
          #355a47 0%,
          transparent 55%
        ),
        linear-gradient(145deg, #1e3931, #101c1b);
    }

    .eyebrow {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero h1 {
      margin: 12px 0 8px;
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.08;
      letter-spacing: -1px;
    }

    .hero h1 span {
      color: var(--mint);
    }

    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .hero-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      margin-bottom: 18px;
      border: 1px solid #6a806a;
      border-radius: 14px;
      color: var(--gold);
      font-size: 25px;
    }

    .card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--panel);
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 15px;
      font-weight: 800;
    }

    .section-number {
      display: grid;
      place-items: center;
      width: 29px;
      height: 29px;
      border-radius: 9px;
      background: #344c3f;
      color: var(--gold);
      font-size: 12px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    select {
      width: 100%;
      min-height: 54px;
      padding: 13px 42px 13px 15px;
      border: 1px solid #4b665a;
      border-radius: 13px;
      background: var(--panel-soft);
      color: var(--text);
      font: inherit;
      font-size: 16px;
      font-weight: 650;
      color-scheme: dark;
    }

    select:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .field-hint {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      width: 100%;
      min-height: 58px;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: var(--gold);
      color: #182b24;
      font: inherit;
      font-size: 16px;
      font-weight: 850;
      cursor: pointer;
    }

    button:active {
      transform: scale(.99);
    }

    .result {
      display: none;
      margin-top: 22px;
      padding: 20px 17px;
      border-radius: 20px;
      background: var(--result);
      color: var(--ink);
    }

    .result h2 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: -.5px;
    }

    .result h3 {
      margin: 26px 0 10px;
      padding-top: 18px;
      border-top: 1px solid #bfd0c4;
      font-size: 16px;
    }

    .line {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 0;
      border-bottom: 1px solid #c7d7ca;
      font-size: 13px;
      line-height: 1.5;
    }

    .line span:first-child {
      flex: 0 0 39%;
      color: #526a5c;
    }

    .line span:last-child {
      flex: 1;
      text-align: right;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .line strong {
      color: #174c3c;
    }

    .note {
      margin-top: 14px;
      color: #536c5c;
      font-size: 12px;
      line-height: 1.65;
    }

    .diagram {
      margin-top: 12px;
      padding: 18px 12px;
      border: 1px dashed #89a797;
      border-radius: 14px;
      background: #f2f7ee;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .foot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9fd5ac;
      box-shadow: 0 0 0 4px #9fd5ac20;
    }

    @media (max-width: 360px) {
      .wrap { padding: 12px; }
      .card { padding: 15px; }
      .two-col { gap: 8px; }
      .line { font-size: 12px; }
    }
  </style>
</head>

<body>
  <main class="wrap">

    <header class="hero">
      
      <div class="eyebrow">The angler's field guide</div>
      <h1>Stillwater<br><span>Rig Assistant.</span></h1>
      <p>
        Smarter rig choices, made simple.
        Built for real days on the water.
      </p>
    </header>

    <section class="card">
      <div class="section-title">
        <span class="section-number">01</span>
        Build your fishing setup
      </div>

      <label for="method">Fishing method</label>
      <select id="method">
        <option>Indicator / Bung</option>
        <option>Static Buzzers</option>
        <option>Dry Fly</option>
        <option>Washing Line</option>
        <option>Pulling Lures</option>
      </select>

      <div class="two-col">
        <div>
          <label for="fly">Fly size</label>
          <select id="fly">
            <option>8</option>
            <option>10</option>
            <option>12</option>
            <option selected>14</option>
            <option>16</option>
            <option>18</option>
            <option>20</option>
          </select>
        </div>

        <div>
          <label for="water">Water</label>
          <select id="water">
            <option>Calm</option>
            <option selected>Light chop</option>
            <option>Windy</option>
          </select>
        </div>
      </div>

      <label for="light">Light &amp; weather</label>
      <select id="light">
        <option value="Early morning">
          Early morning / Low light
        </option>
        <option value="Bright sunshine">Bright sunshine</option>
        <option value="Partly cloudy">Partly cloudy</option>
        <option value="Overcast">Overcast</option>
        <option value="Raining">Raining</option>
        <option value="Snowing">Snowing</option>
        <option value="Evening / Dusk">Evening / Dusk</option>
      </select>

      <p class="field-hint">
        Select your conditions to get a practical
        starting rig and fishing advice.
      </p>

      <button id="find" type="button">
        Find My Rig &rarr;
      </button>

      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <footer class="foot" id="status">
      <span class="offline-dot"></span>
      Offline-ready field guide &bull; Version 8
    </footer>

  </main>

  <script src="app.js?v=8"></script>
</body>
</html>
